name: Build

concurrency:
  group: build
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
      - 'repo.json'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          path: src

      - name: Checkout builds
        uses: actions/checkout@v7
        with:
          ref: builds
          path: builds

      - name: Clean old builds
        run: find "$GITHUB_WORKSPACE/builds" -maxdepth 1 -type f -name '*.cs3' -delete

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Build Plugins
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/src"
          chmod +x ./gradlew
          ./gradlew make makePluginsJson --no-daemon

          shopt -s globstar nullglob
          artifacts=(**/build/*.cs3)
          if ((${#artifacts[@]} == 0)); then
            echo "::error::The build completed without producing any .cs3 plugin artifacts."
            exit 1
          fi
          if [[ ! -s build/plugins.json ]]; then
            echo "::error::The build did not produce a non-empty build/plugins.json."
            exit 1
          fi

          cp -- "${artifacts[@]}" "$GITHUB_WORKSPACE/builds/"
          cp -- build/plugins.json "$GITHUB_WORKSPACE/builds/plugins.json"

      - name: Push builds
        working-directory: builds
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -- '*.cs3' plugins.json
          if git diff --cached --quiet; then
            echo "No generated plugin artifacts changed."
            exit 0
          fi
          git commit -m "Build $GITHUB_SHA"
          git push origin HEAD:builds
