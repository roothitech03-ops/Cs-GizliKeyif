name: Build Validation

on:
  pull_request:
    branches:
      - master
      - main
    paths:
      - '**/*.kt'
      - '**/*.java'
      - '**/*.xml'
      - '**/*.json'
      - '**/*.kts'
      - '**/*.gradle'
      - '**/*.properties'
      - '**/*.toml'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    name: Build all plugins
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Build plugins and validate publishing outputs
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew make makePluginsJson --no-daemon

          shopt -s globstar nullglob
          artifacts=(**/build/*.cs3)
          if ((${#artifacts[@]} == 0)); then
            echo "::error::The build completed without producing any .cs3 plugin artifacts."
            exit 1
          fi
          if [[ ! -s build/plugins.json ]]; then
            echo "::error::The build did not produce a non-empty build/plugins.json."
            exit 1
          fi
          printf 'Validated %s plugin artifact(s) and build/plugins.json.\n' "${#artifacts[@]}"
